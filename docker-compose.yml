services:
  # =========================================================================
  # 1. PostgreSQL 16 Relational Database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: safar-saarthi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-safar_saarthi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-safar_saarthi}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - safar-network

  # =========================================================================
  # 2. Redis 7 In-Memory Cache & Background Queue
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: safar-saarthi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - safar-network

  # =========================================================================
  # 3. AI Multi-Agent Specialist Service (FastAPI / Python)
  # =========================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: safar-saarthi-ai-service
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - BACKEND_API_URL=http://backend:5000/api
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - safar-network

  # =========================================================================
  # 4. Core API Backend Gateway (Node.js / Express / TypeScript / Prisma)
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: safar-saarthi-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:80,http://localhost}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-safar_saarthi}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-safar-saarthi-secure-production-jwt-token-secret-key-32chars}
      - AMADEUS_CLIENT_ID=${AMADEUS_CLIENT_ID:-}
      - AMADEUS_CLIENT_SECRET=${AMADEUS_CLIENT_SECRET:-}
      - AMADEUS_ENV=${AMADEUS_ENV:-test}
      - IRCTC_API_KEY=${IRCTC_API_KEY:-}
      - REDBUS_API_KEY=${REDBUS_API_KEY:-}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - safar-network

  # =========================================================================
  # 5. Frontend SPA & Reverse Proxy (React / Vite / Nginx)
  # =========================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: safar-saarthi-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - safar-network

networks:
  safar-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
