<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%" fill="none">
  <!-- Safar Saarthi Geometric Navigation 'S' Route Mark -->
  <defs>
    <linearGradient id="routeGrad" x1="6" y1="8" x2="34" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#142B3B" />
      <stop offset="55%" stop-color="#24766F" />
      <stop offset="100%" stop-color="#24766F" />
    </linearGradient>
  </defs>
  <!-- Primary geometric journey ribbon path forming an S -->
  <path
    d="M 29 11.5 C 29 8 26.2 5.5 22.2 5.5 C 15.8 5.5 10 10.2 10 16.5 C 10 23.2 18.5 22.8 19.5 26.2 C 20.3 28.8 18.2 31.5 14.5 31.5 C 11.2 31.5 8.5 29.5 8 26.5"
    stroke="url(#routeGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Secondary complementary corridor arc completing the balanced geometric loop -->
  <path
    d="M 11 28.5 C 11 32 13.8 34.5 17.8 34.5 C 24.2 34.5 30 29.8 30 23.5 C 30 16.8 21.5 17.2 20.5 13.8 C 19.7 11.2 21.8 8.5 25.5 8.5 C 28.8 8.5 31.5 10.5 32 13.5"
    stroke="#24766F"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.95"
  />
  <!-- Waypoint Origin Node (Navy) -->
  <circle cx="8" cy="26.5" r="2.5" fill="#142B3B" />
  <!-- Waypoint Destination Node (Teal) -->
  <circle cx="32" cy="13.5" r="2.5" fill="#24766F" />
  <!-- Waypoint Pivot Highlight Node (Amber) -->
  <circle cx="20" cy="20" r="2.2" fill="#D7A45B" />
</svg>
