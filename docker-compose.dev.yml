# =========================================================================
# Safar Saarthi - Local Development Docker Compose Setup
# Spins up PostgreSQL 16 & Redis 7 with local host ports
# =========================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: safar-saarthi-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: safar_saarthi
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safar_saarthi"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  redis:
    image: redis:7-alpine
    container_name: safar-saarthi-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
